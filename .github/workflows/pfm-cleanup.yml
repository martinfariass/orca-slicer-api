name: PFM slicer cleanup

on:
  pull_request:
  push:
    tags:
      - "pfm-bambu-*"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  validate-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - name: Focused cleanup regression suite
        run: npm run test:e2e -- tests/unit/temp-workspaces.spec.ts tests/unit/slice-lifecycle-cleanup.spec.ts

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
      - name: Build exact-base PFM sidecar
        run: docker buildx build --load --platform linux/amd64 -f Dockerfile.pfm-bambu-studio -t pfm-bambu-studio-api:test .

      - name: Real Bambu Studio cleanup integration
        run: tests/integration/pfm-temp-cleanup.sh pfm-bambu-studio-api:test

      - name: Log in to GHCR
        if: startsWith(github.ref, 'refs/tags/pfm-bambu-')
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish immutable release tag
        if: startsWith(github.ref, 'refs/tags/pfm-bambu-')
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/bambu-studio-api
          TAG: ${{ github.ref_name }}
        run: |
          image=$(printf '%s' "$IMAGE" | tr '[:upper:]' '[:lower:]')
          docker tag pfm-bambu-studio-api:test "$image:$TAG"
          docker push "$image:$TAG"
          docker buildx imagetools inspect "$image:$TAG"
